/* Layout: the logo on a white disc, beside (desktop) or above (phone) the booking column */
:root {
  --orange: #F58220;   /* page */
  --rind:   #C25A0C;   /* button ledges */
  --white:  #FFFFFF;   /* logo disc, light buttons (same white as the logo file) */
  --ink:    #231F20;   /* logo black: primary button, icons */
  --text:   #FFFFFF;   /* text sitting directly on the orange */
  --red:    #9C0F1C;   /* logo red: small accents */
  --wa:     #25D366;   /* WhatsApp mark only */
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--orange);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.page {
  flex: 1;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 32px 24px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 28px;
}

/* ---------- Logo on a white disc (logo colours untouched) ---------- */
.brand { margin: 0; }
.medallion {
  width: min(58vw, 224px);
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--white);
  display: grid;
  place-items: center;
  box-shadow: 0 18px 40px -22px rgba(120, 45, 0, 0.55);
}
.medallion svg { width: 62%; height: auto; display: block; }

/* ---------- Booking column ---------- */
.info {
  width: 100%;
  max-width: 440px;
  display: grid;
  gap: 30px;
}
.reserve { display: grid; gap: 14px; }

.headline { display: grid; gap: 2px; text-align: center; }
.headline h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 9vw, 46px);
  line-height: 1;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.headline p {
  margin: 0;
  font-weight: 600;
  font-size: 17px;
}

.btn {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 18px 12px 12px;
  border-radius: 18px;
  text-decoration: none;
  transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:focus-visible, .copy:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 3px;
}
.btn .icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid; place-items: center;
}
.btn .icon svg { width: 24px; height: 24px; display: block; }
.btn .text { min-width: 0; display: grid; }
.btn .t1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.15; }
.btn .t2 { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.btn .arrow { width: 20px; height: 20px; display: block; }

.btn-wa {
  background: var(--ink);
  color: var(--white);
  padding-block: 14px;
  box-shadow: 0 4px 0 var(--rind);
}
.btn-wa:hover { background: #000; }
.btn-wa .icon { background: var(--wa); color: #fff; }
.btn-wa .t2 { color: #F4D9BC; }

.phone {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding-top: 6px;
}
.num {
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  user-select: all;
}
.copy {
  font: 600 13px var(--font-body);
  color: var(--text);
  background: transparent;
  border: 1.5px solid var(--text);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  /* both labels share one cell, so the button never changes size */
  display: inline-grid;
  justify-items: center;
  touch-action: manipulation;
}
.copy > span { grid-area: 1 / 1; white-space: nowrap; }
.copy-done { visibility: hidden; }
.copy.is-done { background: var(--text); color: var(--orange); }
.copy.is-done .copy-idle { visibility: hidden; }
.copy.is-done .copy-done { visibility: visible; }
.copy:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }
.copy.is-done:hover { background: var(--text); }
.note {
  margin: 0;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
}

@media (max-width: 600px) {
  .note span { display: block; }
  .note .sep { display: none; }
}

.follow { display: grid; gap: 12px; }
.follow h2 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  white-space: nowrap;
}
.follow h2::before, .follow h2::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  opacity: .3;
}
.socials { display: grid; gap: 10px; }
.btn-social {
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--rind);
}
.btn-social .icon { background: var(--ink); color: var(--white); }

.foot {
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  opacity: .9;
  padding: 0 20px 20px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--white);
  font-size: 14px;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 999px;
  width: max-content;
  max-width: calc(100vw - 40px);
  text-align: center;
}
[hidden] { display: none !important; }

/* ---------- Desktop: two columns ---------- */
@media (min-width: 860px) {
  .page {
    grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
    align-items: center;
    column-gap: 80px;
    padding-block: 56px;
  }
  .medallion { width: min(36vw, 380px); }
  .headline { text-align: left; }
  .phone { justify-content: flex-start; }
  .note { text-align: left; }
  .btn:hover { transform: translateY(-2px); }
  .btn-wa:hover { box-shadow: 0 6px 0 var(--rind); }
  .btn-social:hover { box-shadow: 0 5px 0 var(--rind); }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:hover, .btn:active { transform: none; }
}
</style>

<script>
(function () {
  var PHONE = '+994502664114';
  var btn = document.getElementById('copy-phone');
  var idle = btn.querySelector('.copy-idle');
  var done = btn.querySelector('.copy-done');
  var num = document.getElementById('phone-number');
  var toast = document.getElementById('toast');
  var timer, toastTimer;

  // 1) Copy event: no focus change, no selection, so the page does not move
  function copyViaEvent(text) {
    var ok = false;
    function onCopy(e) {
      if (!e.clipboardData) return;
      e.clipboardData.setData('text/plain', text);
      e.preventDefault();
      ok = true;
    }
    document.addEventListener('copy', onCopy, true);
    try { document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    return ok;
  }

  // 3) Last resort for old Safari: hidden field, kept where the button is so nothing scrolls
  function copyViaTextarea(text) {
    var r = btn.getBoundingClientRect();
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;' +
                       'top:' + Math.max(0, r.top) + 'px;left:' + Math.max(0, r.left) + 'px;';
    document.body.appendChild(ta);
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    btn.focus({ preventScroll: true });
    return ok;
  }

  function copied() {
    btn.classList.add('is-done');
    idle.setAttribute('aria-hidden', 'true');
    done.removeAttribute('aria-hidden');
    clearTimeout(timer);
    timer = setTimeout(function () {
      btn.classList.remove('is-done');
      done.setAttribute('aria-hidden', 'true');
      idle.removeAttribute('aria-hidden');
    }, 2200);
  }

  function failed() {
    try {
      var range = document.createRange();
      range.selectNodeContents(num);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
    toast.textContent = 'Nömrəni əl ilə kopyalayın · Copy the number manually';
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3500);
  }

  btn.addEventListener('click', function () {
    if (copyViaEvent(PHONE)) { copied(); return; }
    // 2) Clipboard API, called inside the same tap
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(PHONE).then(copied, function () {
        if (copyViaTextarea(PHONE)) copied(); else failed();
      });
    } else if (copyViaTextarea(PHONE)) {
      copied();
    } else {
      failed();
    }
  });
})();
</script>
