/* Layout: the logo on a white disc, beside (desktop) or above (phone) the booking column */
:root {
  --orange: #F58220;   /* page */
  --rind:   #C25A0C;   /* button ledges */
  --white:  #FFFFFF;   /* logo disc, light buttons (same white as the logo file) */
  --ink:    #231F20;   /* logo black: primary button, icons */
  --text:   #FFFFFF;   /* text sitting directly on the orange */
  --red:    #9C0F1C;   /* logo red: small accents */
  --wa:     #25D366;   /* WhatsApp mark only */
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--orange);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.page {
  flex: 1;
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 32px 24px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 28px;
}

/* ---------- Logo on a white disc (logo colours untouched) ---------- */
.brand { margin: 0; }
.medallion {
  width: min(58vw, 224px);
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--white);
  display: grid;
  place-items: center;
  box-shadow: 0 18px 40px -22px rgba(120, 45, 0, 0.55);
}
.medallion svg { width: 62%; height: auto; display: block; }

/* ---------- Booking column ---------- */
.info {
  width: 100%;
  max-width: 440px;
  display: grid;
  gap: 30px;
}
.reserve { display: grid; gap: 14px; }

.headline { display: grid; gap: 2px; text-align: center; }
.headline h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 9vw, 46px);
  line-height: 1;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.headline p {
  margin: 0;
  font-weight: 600;
  font-size: 17px;
}

.btn {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 18px 12px 12px;
  border-radius: 18px;
  text-decoration: none;
  transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 3px;
}
.btn .icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid; place-items: center;
}
.btn .icon svg { width: 24px; height: 24px; display: block; }
.btn .text { min-width: 0; display: grid; }
.btn .t1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.15; }
.btn .t2 { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.btn .arrow { width: 20px; height: 20px; display: block; }

.btn-wa {
  background: var(--ink);
  color: var(--white);
  padding-block: 14px;
  box-shadow: 0 4px 0 var(--rind);
}
.btn-wa:hover { background: #000; }
.btn-wa .icon { background: var(--wa); color: #fff; }
.btn-wa .t2 { color: #F4D9BC; }

.note {
  margin: 0;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
}

@media (max-width: 600px) {
  .note span { display: block; }
  .note .sep { display: none; }
}

.follow { display: grid; gap: 12px; }
.follow h2 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  white-space: nowrap;
}
.follow h2::before, .follow h2::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  opacity: .3;
}
.socials { display: grid; gap: 10px; }
.btn-social {
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--rind);
}
.btn-social .icon { background: var(--ink); color: var(--white); }

.foot {
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  opacity: .9;
  padding: 0 20px 20px;
}


/* ---------- Desktop: two columns ---------- */
@media (min-width: 860px) {
  .page {
    grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
    align-items: center;
    column-gap: 80px;
    padding-block: 56px;
  }
  .medallion { width: min(36vw, 380px); }
  .headline { text-align: left; }
  .note { text-align: left; }
  .btn:hover { transform: translateY(-2px); }
  .btn-wa:hover { box-shadow: 0 6px 0 var(--rind); }
  .btn-social:hover { box-shadow: 0 5px 0 var(--rind); }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:hover, .btn:active { transform: none; }
}
</style>
